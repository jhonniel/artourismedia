name: destination-studio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - bundled-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-destination_studio}
      POSTGRES_USER: ${DB_USERNAME:-destination_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-destination_user} -d ${DB_DATABASE:-destination_studio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: redis
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    networks:
      - app

  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - app

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    command: php artisan schedule:work
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  app_storage:

networks:
  app:
    driver: bridge
