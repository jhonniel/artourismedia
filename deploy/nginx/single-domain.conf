# artourismedia.com — website + admin + API (one domain)
# Install: sudo cp deploy/nginx/single-domain.conf /etc/nginx/sites-available/artourismedia.com
#
# Single entry point: index.php (Laravel). Website/admin HTML is served by routes/web.php.
# Root must be Laravel public/ (index.php + built index.html + admin/index.html).

server {
    listen 443 ssl http2;
    server_name artourismedia.com www.artourismedia.com;

    root /var/www/artourismedia.com/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/artourismedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artourismedia.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32M;

    location = /index.html {
        return 301 /;
    }

    location = /admin/index.html {
        return 301 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Static files first; everything else → Laravel (API + SPA in routes/web.php)
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name artourismedia.com www.artourismedia.com;
    return 301 https://$host$request_uri;
}
